[package]
name = "aethersora"
version = "0.4.0"
edition = "2021"
description = "AetherSora - Ultra-lightweight Windows System Tray Universal Audio Receiver (Wi-Fi 5GHz Lossless + Bluetooth A2DP Sink)"

[[bin]]
name = "AetherSora"
path = "src/main.rs"

[dependencies.windows]
version = "0.58.0"
features = [
    "Media_Audio",
    "Devices_Enumeration",
    "Foundation",
    "Foundation_Collections",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
