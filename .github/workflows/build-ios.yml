name: Build iOS Companion IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "ios/companion/**"
      - ".github/workflows/build-ios.yml"

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/companion
        run: xcodegen generate

      - name: Build unsigned iOS app bundle
        working-directory: ios/companion
        run: |
          set -o pipefail
          xcodebuild \
            -project AetherSoraCompanion.xcodeproj \
            -scheme AetherSoraCompanion \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        working-directory: ios/companion
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/AetherSoraCompanion.app"
          test -d "$APP_PATH"
          test -d "$APP_PATH/PlugIns/BroadcastUpload.appex"
          plutil -lint "$APP_PATH/Info.plist"
          plutil -lint "$APP_PATH/PlugIns/BroadcastUpload.appex/Info.plist"
          plutil -p "$APP_PATH/PlugIns/BroadcastUpload.appex/Info.plist" | grep -q "RPBroadcastProcessModeSampleBuffer"
          rm -rf Payload AetherSora-Companion-iOS-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry ../../AetherSora-Companion-iOS-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: AetherSora-Companion-iOS-unsigned
          path: AetherSora-Companion-iOS-unsigned.ipa
          if-no-files-found: error
