name: AetherSoraCompanion
options:
  bundleIdPrefix: com.aethersora
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: "NO"
    GENERATE_INFOPLIST_FILE: "NO"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    PROVISIONING_PROFILE_SPECIFIER: ""

targets:
  AetherSoraCompanion:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: AetherSoraCompanion
        PRODUCT_BUNDLE_IDENTIFIER: com.aethersora.companion
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/AetherSoraCompanion.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: BroadcastUpload
        embed: true
        codeSign: false
      - sdk: ReplayKit.framework

  BroadcastUpload:
    type: app-extension
    platform: iOS
    sources:
      - path: BroadcastExtension
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: BroadcastUpload
        PRODUCT_BUNDLE_IDENTIFIER: com.aethersora.companion.BroadcastUpload
        INFOPLIST_FILE: BroadcastExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: BroadcastExtension/BroadcastExtension.entitlements
        APPLICATION_EXTENSION_API_ONLY: "YES"
    dependencies:
      - sdk: ReplayKit.framework
      - sdk: AVFoundation.framework
      - sdk: CoreMedia.framework
